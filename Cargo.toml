[package]
name = "wano"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Monitor layout daemon and visual arranger for wlroots compositors"

[[bin]]
name = "wano"
path = "src/main.rs"

[[bin]]
name = "wano-ui"
path = "src/bin/wano-ui.rs"

# Hand-written depends: wayland, xkbcommon and EGL are dlopened, so nothing
# appears in the binaries' link-time dependencies for dpkg-shlibdeps to find.
[package.metadata.deb]
maintainer = "Eugene Dementyev <e@dementyev.me>"
section = "x11"
license-file = ["LICENSE", "0"]
copyright = "2026 Eugene Dementyev"
priority = "optional"
depends = "libc6 (>= 2.39), libgcc-s1, libwayland-client0, libwayland-egl1, libxkbcommon0, libegl1"
recommends = "sway"
extended-description = """\
wano remembers monitor arrangements — position, scale, mode and transform — \
reapplies the matching profile when monitors come and go, and ships a GUI for \
dragging monitors into place. For wlroots compositors via \
wlr-output-management-unstable-v1."""
assets = [
    ["target/release/wano", "usr/bin/", "755"],
    ["target/release/wano-ui", "usr/bin/", "755"],
    ["packaging/wano-ui.desktop", "usr/share/applications/", "644"],
    ["packaging/wano.service", "usr/lib/systemd/user/", "644"],
    ["packaging/wano.svg", "usr/share/icons/hicolor/scalable/apps/wano.svg", "644"],
    ["README.md", "usr/share/doc/wano/README.md", "644"],
]

[dependencies]
anyhow = "1.0.104"
calloop = "0.14.4"
calloop-wayland-source = "0.4.1"
clap = { version = "4.6.7", features = ["derive"] }
eframe = { version = "0.33.3", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
] }
env_logger = "0.11.11"
log = "0.4.34"
notify = "8.2.0"
serde = { version = "1.0.229", features = ["derive"] }
signal-hook = "0.4.4"
toml = "1.1.6"
wayland-client = "0.31.15"
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
