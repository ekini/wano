[package]
name = "wano"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Monitor layout daemon and visual arranger for wlroots compositors"

[[bin]]
name = "wano"
path = "src/main.rs"

[[bin]]
name = "wano-ui"
path = "src/bin/wano-ui.rs"

[dependencies]
anyhow = "1.0.104"
calloop = "0.14.4"
calloop-wayland-source = "0.4.1"
clap = { version = "4.6.7", features = ["derive"] }
eframe = { version = "0.33.3", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
] }
env_logger = "0.11.11"
log = "0.4.34"
notify = "8.2.0"
serde = { version = "1.0.229", features = ["derive"] }
signal-hook = "0.4.4"
toml = "1.1.6"
wayland-client = "0.31.15"
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
